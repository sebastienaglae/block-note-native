name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Web (react-native-web)
        - iOS
        - Android
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Package version(s)
      placeholder: "@sebastienaglae/bnn-react 0.2.0, bnn-core 0.2.0"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, a minimal repro, etc.
