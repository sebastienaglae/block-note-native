name: Publish

# Publishes @sebastienaglae/bnn-core and @sebastienaglae/bnn-react to GitHub
# Packages when a version tag (e.g. v0.1.0) is pushed. The package versions are
# taken from the tag, so the git tag is the single source of truth for releases.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@sebastienaglae"
      - run: npm ci
      - name: Set package versions from the tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm run build -w @sebastienaglae/bnn-core
      - run: npm run build -w @sebastienaglae/bnn-react
      - name: Publish core
        run: npm publish -w @sebastienaglae/bnn-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish react
        run: npm publish -w @sebastienaglae/bnn-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
