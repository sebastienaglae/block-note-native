name: Publish

# Publishes @sebastienaglae/bnn-core and @sebastienaglae/bnn-react to GitHub
# Packages when a version tag (e.g. v0.1.0) is pushed.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@sebastienaglae"
      - run: npm ci
      - run: npm test -w @sebastienaglae/bnn-core
      - run: npm run build -w @sebastienaglae/bnn-core
      - run: npm run build -w @sebastienaglae/bnn-react
      - name: Publish core
        run: npm publish -w @sebastienaglae/bnn-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish react
        run: npm publish -w @sebastienaglae/bnn-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
