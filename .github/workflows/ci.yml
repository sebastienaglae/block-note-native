name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build the packages first so the emitted .d.ts files exist: the react /
      # demo-shared type-checks resolve @sebastienaglae/bnn-core through
      # node_modules, which points at packages/core/dist.
      - name: Build packages
        run: |
          npm run build -w @sebastienaglae/bnn-core
          npm run build -w @sebastienaglae/bnn-react
      - name: Type-check
        run: |
          npm run typecheck -w @sebastienaglae/bnn-core
          npm run typecheck -w @sebastienaglae/bnn-react
          npm run typecheck -w @sebastienaglae/bnn-demo-shared
      - name: Unit tests
        run: npm test
