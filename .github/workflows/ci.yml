name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test -w @sebastienaglae/bnn-core
      - name: Type-check
        run: |
          npm run typecheck -w @sebastienaglae/bnn-core
          npm run typecheck -w @sebastienaglae/bnn-react
          npm run typecheck -w @sebastienaglae/bnn-demo-shared
      - name: Build packages
        run: |
          npm run build -w @sebastienaglae/bnn-core
          npm run build -w @sebastienaglae/bnn-react
